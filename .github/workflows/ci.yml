name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Shared-core gate (issue #65): fmt+clippy+test fan out over all
    # three OSes so the framework-free core promise cannot rot on any
    # platform. The gpui binary is macOS-gated in src/main.rs (stub
    # main elsewhere, macOS-scoped deps in Cargo.toml), so
    # `cargo test --all-targets` is the full GUI suite on macOS and
    # the portable lib suite plus a stub bin off macOS; each native
    # shell proves itself in its own per-OS job below. fail-fast is
    # off so one red OS never hides the other two (fail visible).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets

  macos:
    # Native macOS Swift shell (issue #62): SPM build + unit tests +
    # headless C ABI smoke against the real staticlib, a mock-session
    # window screenshot (issue #77), then a zip artifact
    # (dmg/notarization are explicit non-goals — see
    # packaging/README.md). Runs on macos-latest only and touches
    # nothing outside swift/ + the core staticlib.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: core staticlib
        run: cargo build --lib
      - name: no gpui in the macOS shell
        run: |
          ! grep -rni gpui swift/Sources swift/Tests swift/Package.swift
      - name: swift build
        run: swift build --package-path swift
      - name: swift test
        run: swift test --package-path swift
      - name: headless smoke (real C ABI)
        run: swift/.build/debug/StaapMac --smoke
      - name: seed mock sessions (hermetic)
        run: |
          # Deterministic fake muse-store (issue #77): three sessions across
          # Attention / Working / Idle through the REAL discovery path, so the
          # roster, titles, projects, and status groups render exactly as with
          # live data — offline, with no agent and no network. Statuses come
          # from the classifier itself: an approval marker wins regardless of
          # mtime (Attention), a fresh mtime without markers is Working, an
          # old mtime without markers is Idle.
          SEED="$RUNNER_TEMP/staap-shot"
          STORE="$SEED/xdg/muse/sessions/2026/09/30"
          mkdir -p "$STORE/shot-attention" "$STORE/shot-working" "$STORE/shot-idle"
          cat > "$STORE/shot-attention/session.jsonl" <<'EOF'
          {"payload_type":"metadata","payload":{"record":{"workspace_root":"/tmp/shot-demo/shop"}}}
          {"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"Add checkout retries with backoff"}]}}
          {"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"Needs your approval to edit Cargo.toml (y/n)"}}}
          EOF
          cat > "$STORE/shot-working/session.jsonl" <<'EOF'
          {"payload_type":"metadata","payload":{"record":{"workspace_root":"/tmp/shot-demo/blog"}}}
          {"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"Draft the release notes"}]}}
          {"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"Writing section two of three."}}}
          EOF
          cat > "$STORE/shot-idle/session.jsonl" <<'EOF'
          {"payload_type":"metadata","payload":{"record":{"workspace_root":"/tmp/shot-demo/dotfiles"}}}
          {"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"Clean up old shell aliases"}]}}
          {"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"Done. Removed twelve aliases."}}}
          EOF
          # Relative ages stay glanceable forever ("5m ago", "2d ago"); the
          # working row keeps a fresh mtime so it classifies as Working.
          touch -t "$(date -v-5M +%Y%m%d%H%M)" "$STORE/shot-attention/session.jsonl"
          touch -t "$(date -v-2d +%Y%m%d%H%M)" "$STORE/shot-idle/session.jsonl"
          # Fake muse on PATH: deterministic transcript if the shell spawns,
          # then a long sleep so the child outlives the capture.
          mkdir -p "$SEED/bin" "$SEED/home" "$SEED/shot"
          cat > "$SEED/bin/muse" <<'EOF'
          #!/bin/sh
          printf 'fake-muse-ready-shot\n$ '
          sleep 120
          EOF
          chmod +x "$SEED/bin/muse"
          printf '{"agents": {}}\n' > "$SEED/config.json"
          find "$STORE" -name session.jsonl | sort
      - name: screenshot (mock sessions)
        run: |
          # Launch the real app under the seeded profile (scratch XDG/HOME/
          # config: the runner's live files are never touched), capture the
          # main window, and fail visibly when the PNG is missing or empty.
          SEED="$RUNNER_TEMP/staap-shot"
          # Re-fresh the working row: Working needs an mtime under 60 s old
          # at launch, and the seed step may be older than that by now.
          touch "$SEED/xdg/muse/sessions/2026/09/30/shot-working/session.jsonl"
          PATH="$SEED/bin:$PATH" HOME="$SEED/home" XDG_DATA_HOME="$SEED/xdg" \
            STAAP_CONFIG="$SEED/config.json" \
          # --shot-spawn 3 attaches three live runs up front so the overlap
          # check below sees live Working rows, not just history.
            swift/.build/debug/StaapMac --shot-spawn 3 >"$SEED/shot/app.log" 2>&1 &
          APP_PID=$!
          sleep 6
          if ! kill -0 $APP_PID 2>/dev/null; then
            tail -n 40 "$SEED/shot/app.log" || true
            echo "StaapMac exited before the screenshot" >&2
            exit 1
          fi
          screencapture -x -m "$SEED/shot/macos-mock.png"
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          test -s "$SEED/shot/macos-mock.png"
          mkdir -p dist
          cp "$SEED/shot/macos-mock.png" dist/macos-mock.png
          cp "$SEED/shot/app.log" dist/shot-app.log
          tail -n 20 "$SEED/shot/app.log" || true
      - name: upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: StaapMac-screenshot
          path: |
            dist/macos-mock.png
            dist/shot-app.log
      - name: shot-check unit tests (overlap gate logic)
        run: |
          # Regression suite for the overlap check itself: synthetic
          # captures pin divider finding, polarity, window cropping,
          # and row grouping, so the gate cannot silently rot. Uses
          # the same project-local venv (PEP 668 system python).
          python3 -m venv .venv-shot
          .venv-shot/bin/pip install --quiet pillow
          .venv-shot/bin/python -m unittest discover -s swift/Tests -p "test_*.py"
      - name: sidebar overlap check (live mock rows)
        run: |
          # Structural pixel check over the capture: three live Working rows
          # must render as distinct two-line rows (no merged/overprinted
          # lines). Reference-free; prints diagnostics and an annotated PNG.
          # macos-latest python is externally managed (PEP 668), so the
          # check runs in a project-local venv, not the system interpreter.
          python3 -m venv .venv-shot
          .venv-shot/bin/pip install --quiet pillow
          .venv-shot/bin/python swift/Tests/sidebar_shot_check.py dist/macos-mock.png \
            --expect-rows 3 --annotate dist/macos-mock-annotated.png
      - name: upload annotated check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StaapMac-shot-check
          path: dist/macos-mock-annotated.png
          if-no-files-found: warn
      - name: package (zip; dmg stubbed — see packaging/README.md)
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            swift/.build/debug/StaapMac \
            dist/StaapMac-macos.zip
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaapMac-macos
          path: dist/StaapMac-macos.zip

  linux:
    # Native Linux GTK shell (issue #63): the core library plus the
    # meson-built GTK4/libadwaita/VTE shell against the real C ABI.
    # The gpui binary is macOS-only (macOS-scoped deps in Cargo.toml),
    # so this job gates the lib and the meson suite, never --all-targets.
    # A mock-session window screenshot (issue #77) proves the roster
    # renders, mirroring the macOS/Windows jobs. Runs on ubuntu-latest
    # only and touches nothing outside native/linux + the core staticlib.
    # Ships a tarball; .deb/flatpak are stubbed with a tracking note
    # (see packaging/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - name: system deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev
          meson ninja-build pkg-config gcc xvfb scrot
      - name: core staticlib
        run: cargo build --lib
      - name: core tests
        run: cargo test --lib
      - name: no gpui in the Linux shell
        run: |
          ! grep -rni gpui native/linux/
      - name: meson build
        run: >
          meson setup native/linux/build native/linux
          -Dcore_lib_dir=$PWD/target/debug &&
          meson compile -C native/linux/build
      - name: meson tests
        run: meson test -C native/linux/build --print-errorlogs
      - name: headless UI run
        run: |
          timeout -s TERM 15 xvfb-run -a ./native/linux/build/staap-gtk > /tmp/app.log 2>&1 || true
          grep -v 'libEGL\|DRI3\|session bus\|dbus-launch' /tmp/app.log | head -n 20
          ! grep -E 'Adwaita-ERROR|Gtk-CRITICAL|SMOKE-FAIL' /tmp/app.log
      - name: seed mock sessions (hermetic)
        run: |
          # Same deterministic fake muse-store as the macOS job (three
          # sessions across Attention / Working / Idle through the REAL
          # discovery path, so the roster renders exactly as with live
          # data — offline, with no agent and no network). Statuses come
          # from the classifier itself: an approval marker wins regardless
          # of mtime (Attention), a fresh mtime without markers is
          # Working, an old mtime without markers is Idle.
          SEED="$RUNNER_TEMP/staap-shot"
          STORE="$SEED/xdg/muse/sessions/2026/09/30"
          mkdir -p "$STORE/shot-attention" "$STORE/shot-working" "$STORE/shot-idle"
          cat > "$STORE/shot-attention/session.jsonl" <<'EOF'
          {"payload_type":"metadata","payload":{"record":{"workspace_root":"/tmp/shot-demo/shop"}}}
          {"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"Add checkout retries with backoff"}]}}
          {"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"Needs your approval to edit Cargo.toml (y/n)"}}}
          EOF
          cat > "$STORE/shot-working/session.jsonl" <<'EOF'
          {"payload_type":"metadata","payload":{"record":{"workspace_root":"/tmp/shot-demo/blog"}}}
          {"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"Draft the release notes"}]}}
          {"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"Writing section two of three."}}}
          EOF
          cat > "$STORE/shot-idle/session.jsonl" <<'EOF'
          {"payload_type":"metadata","payload":{"record":{"workspace_root":"/tmp/shot-demo/dotfiles"}}}
          {"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"Clean up old shell aliases"}]}}
          {"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"Done. Removed twelve aliases."}}}
          EOF
          # Relative ages stay glanceable forever ("5m ago", "2d ago"); the
          # working row keeps a fresh mtime so it classifies as Working.
          touch -d '5 minutes ago' "$STORE/shot-attention/session.jsonl"
          touch -d '2 days ago' "$STORE/shot-idle/session.jsonl"
          # Fake muse on PATH: deterministic transcript if the shell spawns,
          # then a long sleep so the child outlives the capture.
          mkdir -p "$SEED/bin" "$SEED/home" "$SEED/shot"
          cat > "$SEED/bin/muse" <<'EOF'
          #!/bin/sh
          printf 'fake-muse-ready-shot\n$ '
          sleep 120
          EOF
          chmod +x "$SEED/bin/muse"
          printf '{"agents": {}}\n' > "$SEED/config.json"
          find "$STORE" -name session.jsonl | sort
      - name: screenshot (mock sessions)
        run: |
          # Launch the real GTK shell under the seeded profile (scratch
          # XDG/HOME/config: the runner's live files are never touched)
          # on a virtual display, capture the window, and fail visibly
          # when the PNG is missing or empty.
          SEED="$RUNNER_TEMP/staap-shot"
          # Re-fresh the working row: Working needs an mtime under 60 s old
          # at launch, and the seed step may be older than that by now.
          touch "$SEED/xdg/muse/sessions/2026/09/30/shot-working/session.jsonl"
          # Own the X server directly (first free display, known PIDs)
          # instead of xvfb-run's wrapper, so the app PID and DISPLAY are
          # unambiguous.
          D=99
          while [ -e "/tmp/.X$D-lock" ]; do D=$((D + 1)); done
          Xvfb ":$D" -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2
          PATH="$SEED/bin:$PATH" HOME="$SEED/home" XDG_DATA_HOME="$SEED/xdg" \
            STAAP_CONFIG="$SEED/config.json" DISPLAY=":$D" \
            ./native/linux/build/staap-gtk >"$SEED/shot/app.log" 2>&1 &
          APP_PID=$!
          sleep 6
          if ! kill -0 $APP_PID 2>/dev/null; then
            tail -n 40 "$SEED/shot/app.log" || true
            echo "staap-gtk exited before the screenshot" >&2
            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi
          DISPLAY=":$D" scrot -z "$SEED/shot/linux-mock.png"
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          wait $XVFB_PID 2>/dev/null || true
          test -s "$SEED/shot/linux-mock.png"
          mkdir -p dist
          cp "$SEED/shot/linux-mock.png" dist/linux-mock.png
          cp "$SEED/shot/app.log" dist/shot-app.log
          grep -v 'libEGL\|DRI3\|session bus\|dbus-launch' "$SEED/shot/app.log" | tail -n 20 || true
      - name: upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: staap-linux-screenshot
          path: |
            dist/linux-mock.png
            dist/shot-app.log
      - name: package (tarball; .deb/flatpak stubbed — see packaging/README.md)
        run: |
          mkdir -p dist
          tar -czf dist/staap-linux.tar.gz \
            -C native/linux/build staap-gtk
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: staap-linux
          path: dist/staap-linux.tar.gz

  windows:
    # Native Windows WinUI shell (issue #64): the core library plus the
    # CMake-built C suite against the real C ABI, plus the live ConPTY
    # converse smoke. The unpackaged WinUI 3 exe also builds here for a
    # mock-session window screenshot (issue #77); MSIX stays a non-goal
    # (see packaging/README.md). Unlike the Linux job this one runs
    # `cargo test --all-targets`, per the issue's acceptance criteria:
    # the gpui binary is macOS-gated in src/main.rs, so on this runner
    # that exercises the full portable lib suite plus a stub bin, while
    # the per-shell proof lives in the CMake/CTest and WinUI steps. Runs
    # on windows-latest only and touches nothing outside native/windows
    # + the core staticlib. Ships an unpackaged zip of the portable C
    # suite.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: core staticlib
        run: cargo build --lib
      - name: test
        run: cargo test --all-targets
      - name: no gpui in the Windows shell
        shell: pwsh
        run: |
          $hits = Get-ChildItem native/windows -Recurse -File | Select-String -Pattern 'gpui'
          if ($hits) { $hits; exit 1 }
      - name: C suite (CMake, MSVC)
        shell: pwsh
        run: |
          cmake -S native/windows -B native/windows/build `
            "-DCORE_LIB_DIR=$env:GITHUB_WORKSPACE/target/debug"
          cmake --build native/windows/build --config Release
          ctest --test-dir native/windows/build -C Release --output-on-failure
      - name: live converse (fake muse.exe)
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass
          -File native/windows/tests/smoke_live.ps1
          -Smoke ./native/windows/build/Release/staap-win-smoke.exe
      - name: WinUI app (msbuild, unpackaged; screenshot-only)
        # Screenshot-only use of the unpackaged exe (issue #77): MSIX stays
        # a non-goal (see packaging/README.md). windows-latest carries VS
        # 2026, whose v145 toolset is what the vcxproj tracks.
        shell: pwsh
        run: |
          msbuild -t:restore native/windows/StaapWinUI.vcxproj
          if ($LASTEXITCODE -ne 0) { throw "msbuild restore failed" }
          msbuild native/windows/StaapWinUI.vcxproj `
            /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "msbuild build failed" }
          $exe = 'native/windows/x64/Release/StaapWinUI/StaapWinUI.exe'
          if (-not (Test-Path $exe)) { throw "WinUI exe missing: $exe" }
      - name: seed mock sessions (hermetic)
        # Same deterministic fake muse-store as the macOS job (three
        # sessions across Attention / Working / Idle through the real
        # discovery path), plus a compiled fake muse.exe for the
        # screenshot step's PATH: the unix harnesses' shell-script fake
        # cannot execute under CreateProcess, hence tests/fake_muse.c +
        # cl, as in tests/smoke_live.ps1.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seed = Join-Path $env:RUNNER_TEMP 'staap-shot'
          $store = Join-Path $seed 'xdg/muse/sessions/2026/09/30'
          $rows = @(
            @{ id = 'shot-attention'; project = 'shop'; prompt = 'Add checkout retries with backoff'; reply = 'Needs your approval to edit Cargo.toml (y/n)'; age = (Get-Date).AddMinutes(-5) },
            @{ id = 'shot-working'; project = 'blog'; prompt = 'Draft the release notes'; reply = 'Writing section two of three.'; age = (Get-Date) },
            @{ id = 'shot-idle'; project = 'dotfiles'; prompt = 'Clean up old shell aliases'; reply = 'Done. Removed twelve aliases.'; age = (Get-Date).AddDays(-2) }
          )
          foreach ($row in $rows) {
            $dir = New-Item -ItemType Directory -Force (Join-Path $store $row.id)
            $log = Join-Path $dir 'session.jsonl'
            $lines = @(
              ('{"payload_type":"metadata","payload":{"record":{"workspace_root":"C:/shot-demo/' + $row.project + '"}}}'),
              ('{"payload_type":"runtime.user_intent.accepted","payload":{"refill_blocks":[{"text":"' + $row.prompt + '"}]}}'),
              ('{"payload_type":"evt","payload":{"kind":"run","event":{"kind":"assistant_message_committed","text":"' + $row.reply + '}}}')
            )
            # WriteAllText: BOM-less UTF-8 with LF joins on every edition
            # (Set-Content's utf8NoBOM exists only in PowerShell 7), so the
            # seeds are byte-identical to the macOS job's.
            [IO.File]::WriteAllText($log, (($lines -join "`n") + "`n"))
            (Get-Item $log).LastWriteTime = $row.age
          }
          New-Item -ItemType Directory -Force (Join-Path $seed 'bin') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $seed 'home') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $seed 'shot') | Out-Null
          cl /nologo /O2 /Fe:"$seed\bin\muse.exe" native/windows/tests/fake_muse.c | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "cl failed to build fake muse.exe" }
          [IO.File]::WriteAllText((Join-Path $seed 'config.json'), ('{"agents": {}}' + "`n"))
          Get-ChildItem $store -Recurse -File | Select-Object FullName, LastWriteTime
      - name: screenshot (mock sessions)
        shell: pwsh
        run: |
          # Launch the unpackaged exe under the seeded profile (scratch
          # XDG/HOME/config: the runner's live files are never touched),
          # capture the primary screen, and fail visibly when the PNG is
          # missing or empty.
          $ErrorActionPreference = 'Stop'
          $seed = Join-Path $env:RUNNER_TEMP 'staap-shot'
          $env:PATH = "$seed\bin;$env:PATH"
          $env:XDG_DATA_HOME = Join-Path $seed 'xdg'
          $env:STAAP_CONFIG = Join-Path $seed 'config.json'
          $env:HOME = Join-Path $seed 'home'
          $exe = 'native/windows/x64/Release/StaapWinUI/StaapWinUI.exe'
          $png = Join-Path $seed 'shot/windows-mock.png'
          # Re-fresh the working row: Working needs an mtime under 60 s old
          # at launch, and the seed step may be older than that by now.
          (Get-Item (Join-Path $seed 'xdg/muse/sessions/2026/09/30/shot-working/session.jsonl')).LastWriteTime = Get-Date
          $proc = Start-Process -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($proc.HasExited) { throw "WinUI app exited before the screenshot" }
            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.Windows.Forms
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              } finally { $g.Dispose() }
              $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bmp.Dispose() }
            if (-not (Test-Path $png) -or (Get-Item $png).Length -eq 0) {
              throw "screenshot missing or empty: $png"
            }
          } finally {
            Stop-Process -InputObject $proc -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $png dist/windows-mock.png
      - name: upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: StaapWindows-screenshot
          path: dist/windows-mock.png
      - name: package portable suite (unpackaged zip; MSIX stubbed — see packaging/README.md)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path native/windows/build/Release/* `
            -DestinationPath dist/StaapWindows.zip
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaapWindows
          path: dist/StaapWindows.zip
